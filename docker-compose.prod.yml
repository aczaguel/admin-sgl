services:
  app:
    volumes:
      - ./.env:/var/www/html/.env:ro
      - writable_data:/var/www/html/writable
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  php82-spike:
    volumes:
      - ./.env:/var/www/html/.env:ro
      - writable_data:/var/www/html/writable

volumes:
  writable_data:
