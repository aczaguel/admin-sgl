services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: admin-sgl:php82
    container_name: admin-sgl-app
    environment:
      DOCKER_BASE_URL: ${DOCKER_BASE_URL:-http://localhost:${DOCKER_APP_PORT:-18080}/}
      DOCKER_DB_HOST: ${DOCKER_DB_HOST:-host.docker.internal}
    # Local-only AWS credentials for the dev IAM user, so the S3 driver can
    # reach the dev bucket from your machine. This file is gitignored; fill it
    # from `terraform output`. In prod the EC2 uses its Instance Profile and
    # needs no keys.
    env_file:
      - ./docker/aws.env
    ports:
      - "${DOCKER_APP_PORT:-18080}:80"
    volumes:
      - .:/var/www/html:cached
    restart: unless-stopped

  php82-spike:
    build:
      context: .
      dockerfile: Dockerfile
    image: admin-sgl:php82
    container_name: admin-sgl-php82-spike
    profiles:
      - tools
    working_dir: /var/www/html
    command: ["bash", "admin/php82-spike.sh", "php"]
    environment:
      DOCKER_DB_HOST: ${DOCKER_DB_HOST:-host.docker.internal}
    volumes:
      - .:/var/www/html:cached
